name: Desktop Build & Test

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows x86-64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Run frontend tests and build
        working-directory: desktop
        run: |
          npm test -- --run
          npm run build

      - name: Verify pinned Windows libmpv runtime
        working-directory: desktop
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-mpv.ps1

      - name: Run Rust formatting, unit tests, and clippy
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build Windows NSIS installer
        working-directory: desktop
        run: npx tauri build --config src-tauri/tauri.windows.conf.json --bundles nsis

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: marquee-desktop-windows-x86_64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  linux:
    name: Linux x86-64 (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libssl-dev \
            libmpv-dev \
            patchelf \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Run frontend tests and build
        working-directory: desktop
        run: |
          npm test -- --run
          npm run build

      - name: Verify Linux libmpv runtime
        working-directory: desktop
        run: bash scripts/setup-mpv.sh

      - name: Run Rust formatting, unit tests, and clippy
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build Linux AppImage and Debian package
        working-directory: desktop
        run: npx tauri build --config src-tauri/tauri.linux.conf.json --bundles deb,appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marquee-desktop-linux-x86_64
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
