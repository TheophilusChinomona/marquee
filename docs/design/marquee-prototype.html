<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marquee TV prototype</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&display=swap">
<style>
:root{--ground:#0A0E13;--booth:#121820;--velvet:#1B2430;--velvet2:#283345;--ink:#F4F1EA;--sand:#BAC3D0;--dust:#8794A8;--bulb:#FFD23F;--bulb-ink:#0A0E13;--bulb-dim:#B8860B;--air:#FF4B3E;--line2:rgba(244,241,234,.34);--ease:cubic-bezier(.2,.8,.2,1);--hud:76px;--ring:0 0 0 4px #0A0E13,0 0 0 10px #FFD23F;--lift:0 28px 56px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070A;overflow:hidden;font-family:'Figtree','Helvetica Neue',Arial,sans-serif}
button{font-family:inherit;border:0;color:inherit}
#wrap{position:fixed;left:0;top:0;right:0;bottom:var(--hud);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform:scale(var(--s,.5));overflow:hidden;background:var(--ground);color:var(--ink);font-size:36px;line-height:1.28;font-weight:500;font-variant-numeric:tabular-nums}
#stage h1,#stage p{margin:0}
.disp{font-family:'Fraunces',Georgia,serif;font-weight:800;font-variation-settings:'opsz' 144,'SOFT' 30;letter-spacing:-.01em;line-height:.98}
.abs{position:absolute}.row{display:flex;align-items:center}.sand{color:var(--sand)}.b{font-weight:700}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen{position:absolute;inset:0;opacity:0;transform:translateY(8px);transition:opacity 280ms var(--ease),transform 280ms var(--ease)}
.screen.on{opacity:1;transform:none}
.scroller{position:absolute;left:0;top:0;width:1920px;transition:transform 240ms var(--ease);will-change:transform}
/* art */
.art{position:absolute;inset:0;background:var(--c1,#7A2E5C);overflow:hidden}
.art::before{content:"";position:absolute;width:64%;aspect-ratio:1;border-radius:50%;background:var(--c2,#F2C14E);right:-10%;top:6%}
.art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h,32%);background:var(--c3,#101A33)}
.art.b::before{left:12%;right:auto;width:44%;top:10%}
.art.c::before{border-radius:0;width:34%;aspect-ratio:auto;height:150%;top:-20%;right:18%;transform:rotate(16deg)}
.art.d::before{width:90%;right:-30%;top:-26%}.art.d::after{height:22%}
.art.e::before{border-radius:0;width:100%;aspect-ratio:auto;height:46%;top:18%;right:0}
.art.none{background:var(--c1)}.art.none::before,.art.none::after{display:none}
.fbt{position:absolute;inset:0;padding:22px;display:flex;align-items:flex-end;font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:44px;line-height:1.04;color:var(--ink)}
.fbt span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.poster .fbt{font-size:48px}.poster .fbt span{-webkit-line-clamp:5}
/* nav */
#nav{position:absolute;left:96px;right:96px;top:54px;height:80px;display:none;align-items:center;gap:48px;z-index:20;transition:opacity 200ms var(--ease)}
#stage[data-nav="1"] #nav{display:flex}
#stage.scrolled #nav{opacity:0;pointer-events:none}
.wordmark{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:44px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:20px}
.wordmark i{width:12px;height:12px;border-radius:50%;background:var(--bulb);display:inline-block;margin-right:8px}
.tabs{display:flex;gap:8px;margin-left:24px}
.tab{position:relative;height:64px;padding:0 28px;border-radius:32px;display:flex;align-items:center;font-weight:600;color:var(--sand);transition:transform 160ms var(--ease)}
.tab.sel{color:var(--ink);font-weight:700}
.tab.sel::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--bulb)}
.tab.foc{background:var(--bulb);color:var(--bulb-ink);font-weight:800;transform:scale(1.06)}.tab.foc::after{display:none}
.prof{margin-left:auto;display:flex;align-items:center;gap:16px;height:64px;padding:0 24px 0 8px;border-radius:32px;background:rgba(27,36,48,.92);font-weight:600}
.prof.foc{background:var(--bulb);color:var(--bulb-ink);transform:scale(1.06)}
.av{width:48px;height:48px;border-radius:14px;background:var(--c1,#C8352A);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:36px;line-height:1}
/* cards */
.card{position:relative;flex:none;border-radius:16px;overflow:hidden;background:var(--velvet);transition:transform 180ms var(--ease),box-shadow 160ms var(--ease)}
.land{width:400px;height:225px}.poster{width:280px;height:420px}.wide{width:560px;height:216px}.top{width:240px;height:360px}.sm{width:288px;height:162px}
.cap{position:absolute;left:0;right:0;bottom:0;padding:56px 20px 18px;background:linear-gradient(0deg,rgba(10,14,19,.96) 42%,rgba(10,14,19,0));display:flex;flex-direction:column}
.cap .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster .cap .t,.top .cap .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cap .m{display:none;color:var(--sand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap.nn .m{display:block}
.noart .cap .t{display:none}
.card.foc{transform:scale(1.08);box-shadow:var(--ring),var(--lift);z-index:6}
.card.foc .cap .m{display:block}.card.foc .cap{padding-bottom:30px}
.tl{position:absolute;left:16px;top:16px;display:flex;gap:8px}.tr{position:absolute;right:16px;top:16px;display:flex;gap:8px}
.tk span{display:inline-block;animation:tkr 5s ease-in-out .8s infinite alternate}.tk{text-overflow:clip!important}
@keyframes tkr{to{transform:translateX(var(--d))}}
.rail{position:absolute;left:20px;right:20px;bottom:12px;height:12px;background:radial-gradient(circle at 6px 6px,var(--bulb-dim) 4.5px,transparent 5px) 0 0/16px 12px repeat-x}
.rail i{position:absolute;left:0;top:0;bottom:0;width:var(--p,50%);overflow:hidden;background:radial-gradient(circle at 6px 6px,var(--bulb) 4.5px,transparent 5px) 0 0/16px 12px repeat-x}
.rail.flow{position:relative;left:auto;right:auto;bottom:auto}
.pager{display:flex;gap:14px;align-items:center}.pager .pg{width:20px;height:20px;border-radius:50%;background:var(--bulb-dim);transition:width 200ms var(--ease)}.pager .pg.on{background:var(--bulb);width:48px;border-radius:10px}
.pager .pg.foc{box-shadow:0 0 0 4px #0A0E13,0 0 0 8px #FFD23F}
.badge{display:inline-flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:10px;font-weight:700;border:3px solid var(--line2);white-space:nowrap}
.badge.live{background:var(--air);border-color:var(--air);color:var(--ground);font-weight:800}.badge.live::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--ground)}
.badge.new{background:var(--ink);border-color:var(--ink);color:var(--ground)}.badge.fill{background:var(--velvet2);border-color:var(--velvet2)}.badge.warn{border-color:var(--air);color:var(--air)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:20px;height:88px;padding:0 40px;border-radius:44px;background:var(--velvet2);color:var(--ink);font-weight:700;font-size:40px;white-space:nowrap;transition:transform 160ms var(--ease),box-shadow 160ms var(--ease)}
.btn.sm2{height:72px;font-size:36px;padding:0 32px;border-radius:36px}
.btn.primary{background:var(--ink);color:var(--ground)}
.btn.foc{background:var(--bulb);color:var(--bulb-ink);transform:scale(1.06);box-shadow:var(--ring),var(--lift);z-index:6}
.btn.dis{background:transparent;border:3px dashed var(--line2);color:var(--dust)}
.rowlabel{font-weight:700;font-size:44px;line-height:1.1;display:flex;align-items:baseline;gap:24px;height:48px;margin-left:96px;margin-bottom:32px}
.rowlabel .why{font-weight:500;font-size:36px;color:var(--sand)}
.vp{margin:-28px 0 -28px 64px;padding:28px 0 28px 32px;overflow:hidden}
.track{display:flex;gap:32px;align-items:flex-start;transition:transform 240ms var(--ease);will-change:transform}
.hrow{margin-bottom:84px}
.unit{position:relative;flex:none;width:398px;height:360px}.unit .num{position:absolute;left:0;bottom:-34px;font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:300px;line-height:1;color:var(--tint,#2A120E);-webkit-text-stroke:6px #BAC3D0;letter-spacing:-.04em}
.unit.hot .num{-webkit-text-stroke-color:#FFD23F}.unit .card{position:absolute;left:150px;top:0}
.lbl{font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}
.kbdkey{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:56px;padding:0 14px;border-radius:12px;border:3px solid var(--line2);font-weight:700}
.chip{height:64px;padding:0 28px;border-radius:32px;background:var(--velvet);display:inline-flex;align-items:center;font-weight:600;white-space:nowrap;transition:transform 160ms var(--ease)}
.chip.foc{background:var(--bulb);color:var(--bulb-ink);transform:scale(1.06);box-shadow:var(--ring);z-index:6}
.chip.sel{background:var(--velvet2)}
.chase{display:flex;gap:10px;align-items:center}.chase i{width:16px;height:16px;border-radius:50%;background:var(--bulb-dim);animation:chs 1s steps(1) infinite}.chase i:nth-child(2){animation-delay:.25s}.chase i:nth-child(3){animation-delay:.5s}.chase i:nth-child(4){animation-delay:.75s}
@keyframes chs{0%{background:var(--bulb)}25%,100%{background:var(--bulb-dim)}}
.sk{background:var(--velvet);border-radius:16px;animation:skp 1.4s ease-in-out infinite alternate}@keyframes skp{to{opacity:.55}}
/* home hero */
#hero{position:absolute;left:0;top:0;width:1920px;height:676px}
#hero .layer{transition:opacity 220ms var(--ease)}#hero.swap .layer{opacity:0}
/* guide */
.cell{position:absolute;top:0;height:88px;border-radius:12px;background:var(--velvet);padding:0 20px;display:flex;align-items:center;gap:12px;font-weight:600;white-space:nowrap;overflow:hidden}
.cell span{overflow:hidden;text-overflow:ellipsis}.cell.past{color:var(--sand)}
.cell.foc{background:var(--bulb);color:var(--bulb-ink);font-weight:800;box-shadow:0 0 0 4px #0A0E13,0 0 0 8px #FFD23F;z-index:3}
.cell.nodata{background:transparent;border:3px dashed var(--line2);color:var(--dust);font-weight:500}
.cell.nodata.foc{background:var(--bulb);border-color:var(--bulb);color:var(--bulb-ink)}
.grow{position:absolute;left:0;width:1920px;height:88px}
.ch{position:absolute;left:96px;top:0;height:88px;width:340px;display:flex;align-items:center;gap:16px}.ch .no{width:76px;font-weight:700;color:var(--sand)}
.ch .tile{flex:1;min-width:0;height:88px;border-radius:12px;background:var(--velvet2);display:flex;align-items:center;gap:14px;padding:0 16px;font-weight:700;position:relative}
.mono{width:56px;height:56px;flex:none;border-radius:10px;background:var(--c1);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:36px;color:var(--ink)}
.fav{position:absolute;right:10px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--bulb)}
.nowline{position:absolute;top:504px;bottom:0;width:12px;z-index:4;background:radial-gradient(circle at 6px 8px,#FFD23F 4px,#0A0E13 4.5px,#0A0E13 6px,transparent 6.5px) 0 0/12px 16px repeat-y;pointer-events:none}
.tick{position:absolute;top:504px;bottom:0;width:3px;background:rgba(244,241,234,.12)}
/* detail + misc */
.ep{position:relative;width:904px;height:176px;border-radius:16px;background:rgba(27,36,48,.94);display:flex;align-items:center;gap:28px;padding:7px 28px 7px 7px;margin-bottom:16px;transition:box-shadow 160ms var(--ease)}
.ep .still{position:relative;width:288px;height:162px;border-radius:10px;overflow:hidden;flex:none}.ep .tx{min-width:0;flex:1}
.ep .tt{font-weight:700;font-size:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ep .ds{color:var(--sand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep.w .tt{color:var(--sand)}.ep.foc{background:var(--velvet2);box-shadow:0 0 0 4px #0A0E13,0 0 0 10px #FFD23F,var(--lift);z-index:5}
.key{height:104px;border-radius:16px;background:var(--velvet2);font-weight:700;font-size:44px;display:flex;align-items:center;justify-content:center;transition:transform 140ms var(--ease)}
.key.foc{background:var(--bulb);color:var(--bulb-ink);box-shadow:var(--ring);transform:scale(1.08);z-index:3}
.pf{position:relative;width:240px;display:flex;flex-direction:column;align-items:center;gap:16px;flex:none}
.pa{position:relative;width:240px;height:240px;border-radius:44px;overflow:hidden;background:var(--c1);transition:transform 180ms var(--ease)}
.pa .ltr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:128px;color:var(--ltr,#F4F1EA)}
.pa.foc{transform:scale(1.12);box-shadow:var(--ring),var(--lift);z-index:3}
.pa.add{background:transparent;border:4px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:var(--sand)}
.pn{font-size:40px;font-weight:600;color:var(--sand)}.pf.hot .pn{color:var(--ink);font-weight:800}
.pp{width:104px;height:104px;border-radius:52px;display:flex;align-items:center;justify-content:center;background:var(--velvet2);transition:transform 160ms var(--ease)}
.pp.foc{background:var(--bulb);color:var(--bulb-ink);box-shadow:var(--ring),var(--lift);transform:scale(1.06)}
.scrub{position:absolute;left:96px;right:96px;top:906px;height:16px;background:radial-gradient(circle at 8px 8px,#B8860B 5.5px,transparent 6px) 0 0/20px 16px repeat-x}
.scrub i{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:radial-gradient(circle at 8px 8px,#FFD23F 5.5px,transparent 6px) 0 0/20px 16px repeat-x}
.scrub b{position:absolute;left:var(--p,0%);top:-14px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--bulb);box-shadow:0 0 0 4px #0A0E13;transition:box-shadow 140ms}
.scrub.foc b{box-shadow:0 0 0 4px #0A0E13,0 0 0 10px #FFD23F;transform:scale(1.15)}
.ctl{opacity:0;pointer-events:none;transition:opacity 220ms var(--ease)}.show .ctl{opacity:1;pointer-events:auto}
.banner{position:absolute;left:96px;right:96px;top:662px;height:364px;border-radius:24px;background:rgba(18,24,32,.96);padding:32px 40px;display:flex;flex-direction:column;gap:24px}
.chno{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:96px;line-height:1;letter-spacing:-.02em}
#sheet{position:absolute;inset:0;z-index:50;background:rgba(10,14,19,.86);display:none;align-items:center;justify-content:center}
#sheet.on{display:flex}
.panel{width:1100px;background:var(--booth);border-radius:24px;padding:48px;border:3px solid rgba(244,241,234,.16)}
.panel .h{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:64px;line-height:1.02}
.panel .p{margin-top:16px;font-size:38px;line-height:1.3;color:var(--sand)}
.panel .acts{display:flex;gap:24px;margin-top:36px;flex-wrap:wrap}
.banner-off{position:absolute;left:96px;right:96px;top:150px;height:96px;border-radius:16px;background:rgba(18,24,32,.96);border:3px solid var(--air);display:none;align-items:center;gap:24px;padding:0 24px;z-index:15}
#stage.offline .banner-off{display:flex}
#stage.offline #hero .why{visibility:hidden}
#safe{position:absolute;inset:54px 96px;border:3px dashed rgba(255,210,63,.5);pointer-events:none;z-index:99;display:none}
body.outlines #safe{display:block}
body.outlines .f{outline:3px dashed rgba(255,210,63,.75);outline-offset:3px}
body.rm *{transition-duration:0ms!important;animation:none!important}
body.rm .card.foc{transform:none;box-shadow:0 0 0 4px #0A0E13,0 0 0 14px #FFD23F}
body.rm .btn.foc,body.rm .tab.foc,body.rm .prof.foc,body.rm .chip.foc,body.rm .pa.foc,body.rm .key.foc,body.rm .pp.foc{transform:none}
body.rm .screen{transform:none}
/* hud */
#hud{position:fixed;left:0;right:0;bottom:0;height:var(--hud);background:#0A0E13;border-top:1px solid #283345;display:flex;align-items:center;gap:8px;padding:0 12px;color:#BAC3D0;font:600 14px/1.2 'Figtree',Arial,sans-serif;overflow-x:auto;white-space:nowrap}
#hud button{background:#1B2430;color:#F4F1EA;border-radius:8px;padding:9px 12px;font:600 14px 'Figtree',Arial,sans-serif;cursor:pointer;border:1px solid #283345}
#hud button[aria-pressed="true"]{background:#FFD23F;color:#0A0E13;border-color:#FFD23F}
#hud .keys{margin-left:auto;color:#8794A8;padding-left:16px}
</style>
</head>
<body>
<div id="wrap"><div id="stage" data-nav="0">
  <div id="view" class="screen"></div>
  <div id="nav"><div class="wordmark">Marquee <span><i></i><i></i><i></i></span></div><div class="tabs" id="tabs"></div><div class="f prof" id="profChip" data-act="tab:profiles"><div class="av" id="profAv">T</div><span id="profName">Theo</span></div></div>
  <div class="banner-off"><span class="badge warn">OFFLINE</span><span class="b">Can't reach your provider. Showing saved rows.</span><span style="flex:1"></span><button class="btn sm2 f" data-act="retry" id="retryBtn">Retry</button></div>
  <div id="sheet"></div>
  <div id="safe"></div>
</div></div>
<div id="hud">
  <button data-t="outlines" aria-pressed="false">Focus outlines (O)</button>
  <button data-t="rm" aria-pressed="false">Reduced motion (M)</button>
  <button data-t="epg" aria-pressed="false">No EPG</button>
  <button data-t="empty" aria-pressed="false">Empty My List</button>
  <button data-t="offline" aria-pressed="false">Offline</button>
  <button data-t="noart" aria-pressed="false">Missing art</button>
  <button data-t="long" aria-pressed="false">Long titles</button>
  <button data-t="expired" aria-pressed="false">Expired login</button>
  <button data-t="error" aria-pressed="false">Playback error</button>
  <span class="keys">Arrows move · Enter selects · Backspace/Esc back · Search: type · Live: Up/Down zap, L last, F favourites, PgUp/PgDn ±2h · Player: any key shows controls</span>
</div>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const stage=$('#stage'),view=$('#view'),sheetEl=$('#sheet');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAL=[['#E5412B','#F6D04D','#141A2E'],['#1F5FD6','#F7E6C4','#0C1E52'],['#0E8C87','#F4DDA8','#06403F'],['#F08CB0','#141A2E','#F6D04D'],['#2E7D4F','#F0D77A','#0F3D26'],['#F2762E','#FBE9D0','#141A2E']];
const ART=['','b','c','d','e'];
const mixHex=(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const x=p(a),y=p(b);return '#'+x.map((v,i)=>Math.round(v*t+y[i]*(1-t)).toString(16).padStart(2,'0')).join('')};
const GT=(amb)=>mixHex(amb,'#0A0E13',.22);
/* ---------- catalogue ---------- */
const T=[
['ss','Salt & Static','movie','2025','15+',112,'Drama, Thriller','4K',"A lighthouse keeper's radio starts picking up a station that is broadcasting tomorrow's news."],
['nf','Night Ferry','movie','2023','15+',118,'Mystery, Drama','4K','Stranded on the last ferry of winter, a night-shift nurse realises one passenger is travelling under a name she buried years ago.'],
['hl','Harbour Lights','series','2022–2025','15+',3,'Drama','4K','Three families share one tidal harbour and a rule nobody will explain. Season two begins the night the lamp fails.'],
['lt','The Long Table','series','2024','12+',2,'Drama','HD','A dinner party that never ends, and a guest list that keeps changing.'],
['qh','Quiet Hours','series','2025','15+',3,'Drama','HD','A night-shift radio host starts to hear listeners who should not be awake.'],
['sl','The Salt Line','movie','2024','12+',100,'Drama','4K','Two cousins walk a disputed shoreline to settle an inheritance.'],
['go','Glass Orchard','movie','2023','12+',104,'Drama','HD','A greenhouse, a feud, and one very expensive pear.'],
['mp','Midnight Provisions','movie','2022','PG',96,'Comedy','HD','The night manager of a corner shop becomes the neighbourhood confessor.'],
['lh','Lantern Hill','movie','2025','15+',110,'Mystery','4K','A lamplighter inherits a hill nobody can map.'],
['ts','Ten Thousand Steps','movie','2020','PG',88,'Documentary','HD','One postman, one winter, and every stair in the city.'],
['ph','Pale Harbour','movie','2024','15+',101,'Mystery','HD','A missing ferry returns with the wrong passengers.'],
['kr',"The Keeper's Radio",'movie','2022','12+',97,'Drama','HD','A radio left on in an empty lighthouse starts taking calls.'],

  $('#tabs').innerHTML=tabs.map(t=>`<div class="f tab${t[0]===act?' sel':''}" data-k="tab:${t[0]}" data-act="tab:${t[0]}">${t[1]}</div>`).join('');
  $('#profAv').textContent=S.profiles[S.prof][0][0];$('#profAv').style.setProperty('--c1',S.profiles[S.prof][1]);$('#profName').textContent=S.profiles[S.prof][0];
  cur=null;
  if(route.name==='live'){G.zone='grid';drawGuide()}
  if(route.name==='search'){drawSearch(true)}
  if(route.name==='player'){pUI();if(P.mode==='vod')pTimer=setInterval(()=>{if(P&&P.playing&&!sheetOn){P.pos=Math.min(P.dur,P.pos+1);pUI();if(P.pos>=P.dur&&P.eps)acts.next()}},1000);pShow()}
  requestAnimationFrame(()=>view.classList.add('on'));
  if(route.name==='live'){cur=null}else if(route.name==='player'){const t=$(P.mode==='vod'?'#pPP':'[data-k="p:guide"]');if(t)setFocus(t)}else focusFirst(fk);
  route.fk=fk}
const redraw=()=>{const fk=cur&&cur.dataset&&cur.dataset.k;const gz=G&&G.zone;draw(fk);if(route.name==='live'&&gz==='ui'){G.zone='ui';drawGuide()}};
/* ---------- focus ---------- */
function scope(){const root=sheetOn?sheetEl:(S.offline&&offFocus?stage:view);return $$('.f',stage).filter(e=>{if(sheetOn)return sheetEl.contains(e);if(e.closest('.banner-off'))return S.offline;if(e.closest('#nav'))return stage.dataset.nav==='1';if(!view.contains(e))return false;if(route.name==='player'&&!view.classList.contains('show'))return false;if(e.style.display==='none'||e.closest('[style*="display: none"]')||e.closest('[style*="display:none"]'))return false;return true})}
let offFocus=false;
function vpos(el){let x=0,y=0,n=el;while(n&&n!==stage){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent}
  for(n=el.parentElement;n&&n!==stage;n=n.parentElement){if(n.dataset){if(n.dataset.sx)x-=+n.dataset.sx;if(n.dataset.sy)y-=+n.dataset.sy}}return{x:x+el.offsetWidth/2,y:y+el.offsetHeight/2,w:el.offsetWidth,h:el.offsetHeight}}
function setFocus(el){if(!el)return;if(cur){cur.classList.remove('foc');untick(cur)}cur=el;el.classList.add('foc');ensure(el);tick(el);if(route&&route.name==='home'&&el.dataset.act&&el.dataset.act.startsWith('hero:'))hero(+el.dataset.act.split(':')[1],true)}
function focusFirst(fk){let n=fk&&$(`[data-k="${fk}"]`);if(!n){const sc=scope().filter(e=>!e.closest('#nav'));n=route.name==='home'?$('[data-k="hero:play"]'):route.name==='search'?$('[data-k="k:H"]'):sc[0]||scope()[0]}if(n)setFocus(n)}
function tick(el){const t=$('.t',el)||$('.tt',el);if(!t||S.rm)return;const sp=$('span',t)||t;if(sp.scrollWidth>t.clientWidth+2&&!t.classList.contains('tk')&&sp!==t){sp.style.setProperty('--d',-(sp.scrollWidth-t.clientWidth)+'px');t.classList.add('tk')}}
function untick(el){$$('.tk',el).forEach(t=>t.classList.remove('tk'))}
function ensure(el){const tr=el.closest('.track');if(tr){let it=el;while(it.parentElement!==tr)it=it.parentElement;const kids=[...tr.children];const idx=kids.indexOf(it);const pitch=kids.length>1?kids[1].offsetLeft-kids[0].offsetLeft:0;const vw=tr.parentElement.clientWidth-32;const max=Math.max(0,tr.scrollWidth-1728);const sx=Math.min(max,Math.max(0,(idx-1)*pitch));tr.style.transform=`translateX(${-sx}px)`;tr.dataset.sx=sx}
  const sec=el.closest('[data-sec]');const sc=el.closest('.scroller');if(sc){let sy=0;if(sec){const top=sec.offsetTop+(sec.offsetParent&&sec.offsetParent!==sc?sec.offsetParent.offsetTop:0);sy=top<=(+sc.dataset.first)?0:top-(+sc.dataset.anchor)}sc.style.transform=`translateY(${-sy}px)`;sc.dataset.sy=sy;if(route.name==='home'||route.name==='browse')stage.classList.toggle('scrolled',sy>0)}
  const el2=el.closest('.ep');if(el2){const lst=$('#eplist');const idx=[...lst.children].indexOf(el2);const sy=Math.max(0,idx-2)*192;lst.style.transform=`translateY(${-sy}px)`;lst.dataset.sy=sy}}
function move(d){if(!scope().length)return;if(!cur||!document.contains(cur)){return focusFirst()}const c=vpos(cur);const all=scope().filter(e=>e!==cur).map(e=>({e,p:vpos(e)}));let best=null;
  if(d==='left'||d==='right'){const s=d==='right'?1:-1;const c2=all.filter(o=>(o.p.x-c.x)*s>8&&Math.abs(o.p.y-c.y)<(o.p.h+c.h)/2*0.9);c2.sort((a,b)=>Math.abs(a.p.x-c.x)-Math.abs(b.p.x-c.x)||Math.abs(a.p.y-c.y)-Math.abs(b.p.y-c.y));best=c2[0]}
  else{const s=d==='down'?1:-1;const c2=all.filter(o=>(o.p.y-c.y)*s>8&&Math.abs(o.p.y-c.y)>Math.min(o.p.h,c.h)*.5-1);if(c2.length){const m=Math.min(...c2.map(o=>Math.abs(o.p.y-c.y)));const band=c2.filter(o=>Math.abs(o.p.y-c.y)<=m+90);band.sort((a,b)=>Math.abs(a.p.x-c.x)-Math.abs(b.p.x-c.x));best=band[0]}}
  if(best)setFocus(best.e.e||best.e)}
function hero(i,silent){if(i===heroI)return;heroI=i;const h=$('#hero');if(!h)return;const k=cur&&cur.dataset.k;h.classList.add('swap');setTimeout(()=>{const it=BY[HERO[heroI]];const tmp=document.createElement('div');tmp.innerHTML=heroHTML(it);const nh=tmp.firstElementChild;h.replaceWith(nh);view.style.background=GT(it.amb);const c=k&&$(`[data-k="${k}"]`);if(c){cur=c;c.classList.add('foc')}},S.rm?0:160)}
/* ---------- actions ---------- */
const acts={
 tab(n){if(n==='profiles'){S.manage=false;return goRoot('profiles',{})}if(n==='home')return goRoot('home',{});if(n==='live')return goRoot('live',{});if(n==='search'){Q='';srch='idle';return nav('search',{})}return goRoot('browse',{kind:n})},
 open(id){const it=BY[id];if(!it)return;nav('detail',{id})},
 play(id){play({id})},list(id){S.list.has(id)?S.list.delete(id):S.list.add(id);redraw()},
 trailer(id){sheet({h:'No trailer for this title',p:'Your provider does not list one. Play starts the film.',acts:[['Close','close',1]]})},
 ep(a){const[id,n]=a.split(':');play({id,ep:+n})},season(n){season=+n;redraw()},
 hero(i){},prof(i){S.prof=+i;if(S.manage&&false){}if(S.manage){const p=S.profiles[+i];return sheet({h:'Edit '+p[0],p:p[3]?'Kids profile: hides 15+ titles and news channels.':'Rename, set as a Kids profile, or delete.',acts:[['Rename','close',1],[p[3]?'Turn off Kids':'Make Kids profile','kids:'+i],['Delete','close']]})}goRoot('home',{})},
 addprof(){sheet({h:'Add profile',p:'It shares this provider login and starts with an empty My List.',acts:[['Create "Guest"','newprof',1],['Cancel','close']]})},
 manage(){S.manage=!S.manage;redraw()},
 key(c){setQ(Q+c)},del(){setQ(Q.slice(0,-1))},clr(){setQ('')},q(v){setQ(v)},
 mic(){const f=$('#shint');f.textContent='Listening…';setTimeout(()=>{setQ('night')},900)},
 live(i){playLive(+i)},gwatch(){playLive(CH.indexOf(gList()[G.ci]))},gstart(){const ch=gList()[G.ci];if(ch.cu)play({id:'__cu',t:'Start over · '+ch.name})},
 gfav(){G.fav=!G.fav;G.ci=0;drawGuide()},gday(d){G.w=Math.max(-1440,Math.min(4200,Math.floor(G.w/1440)*1440+d*1440+(G.w%1440)));G.t=Math.max(G.t,G.w);G.t=G.w+10;drawGuide()},
 gnow(){G.w=1200;G.t=NOW;G.zone='grid';if(cur){cur.classList.remove('foc');cur=null}drawGuide()},
 pp(){P.playing=!P.playing;pUI()},skip(){P.pos=60;pUI();pShow()},next(){const it=P.item;if(it)play({id:it.id,ep:5});},
 aud(){sheet({h:'Audio and subtitles',p:'English 5.1 · Subtitles off',acts:[['English 5.1','close',1],['Afrikaans','close'],['Subtitles: EN','close'],['Off','close']]})},
 eps(){back()},pguide(){goRoot('live',{})},plast(){zap(0,lastCh)},
 retry(){S.offline=false;sync();redraw()},noop(){},
 sh(a){if(a==='close')return closeSheet();if(a==='back'){closeSheet();return back()}if(a==='newprof'){S.profiles.push(['Guest','#F08CB0','#F4F1EA']);closeSheet();return redraw()}if(a.startsWith('kids:')){const p=S.profiles[+a.slice(5)];p[3]=p[3]?0:1;closeSheet();return redraw()}}
};
function act(){if(!cur)return;const a=cur.dataset.act;if(!a)return;const i=a.indexOf(':');const n=i<0?a:a.slice(0,i),arg=i<0?'':a.slice(i+1);if(acts[n])acts[n](arg)}
function zap(d,to){if(!P||P.mode!=='live')return;const n=to!=null?to:(P.ch+d+CH.length)%CH.length;lastCh=P.ch;P.ch=n;P.title=CH[n].name;pBufShow();pUI();pShow();if(cur&&!cur.isConnected)cur=null}
function pBufShow(){const b=$('#pBuf');if(!b)return;b.style.display='flex';clearTimeout(bufT);bufT=setTimeout(()=>{b.style.display='none'},900)}
/* ---------- keys ---------- */
function sync(){stage.classList.toggle('offline',S.offline);$$('#hud [data-t]').forEach(b=>{const k=b.dataset.t;const on=k==='outlines'?document.body.classList.contains('outlines'):k==='rm'?S.rm:k==='epg'?!S.epg:k==='empty'?S.empty:k==='offline'?S.offline:k==='noart'?!S.art:k==='long'?S.long:false;b.setAttribute('aria-pressed',on)})}
function toggle(k){if(k==='outlines')document.body.classList.toggle('outlines');else if(k==='rm'){S.rm=!S.rm;document.body.classList.toggle('rm',S.rm)}else if(k==='epg'){S.epg=!S.epg;redraw()}else if(k==='empty'){S.empty=!S.empty;redraw()}else if(k==='offline'){S.offline=!S.offline;sync();if(S.offline&&route.name==='player')playError()}else if(k==='noart'){S.art=!S.art;redraw()}else if(k==='long'){S.long=!S.long;redraw()}else if(k==='expired'){sheet({h:'Your provider login has expired',p:'Profiles, lists and history are safe. Update the login to keep watching.',acts:[['Update login','close',1],['Not now','close']]})}else if(k==='error'){if(route.name==='player')playError();else S.errorNext=true,sheet({h:'Playback error armed',p:'The next title you play will show the error state.',acts:[['OK','close',1]]})}sync()}
$$('#hud [data-t]').forEach(b=>b.addEventListener('click',()=>{toggle(b.dataset.t);b.blur()}));
const DIR={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey)return;const k=e.key;
  if(route.name==='search'&&!sheetOn&&/^[a-zA-Z0-9 ]$/.test(k)){e.preventDefault();setQ(Q+k.toLowerCase());return}
  if(route.name!=='search'&&!sheetOn){if(k==='o'||k==='O'){toggle('outlines');return}if(k==='m'||k==='M'){toggle('rm');return}}
  if(k==='Escape'||k==='Backspace'){e.preventDefault();
    if(sheetOn)return closeSheet();
    if(route.name==='search'&&k==='Backspace'&&Q)return setQ(Q.slice(0,-1));
    if(route.name==='search'&&k==='Escape'&&Q)return setQ('');
    if(route.name==='player'&&k==='Escape'&&view.classList.contains('show')){view.classList.remove('show');if(cur){cur.classList.remove('foc');cur=null}return}
    if(route.name==='live'&&G.zone==='ui'&&k==='Escape'){}
    if(stack.length)return back();
    if(route.name!=='home'&&route.name!=='profiles')return goRoot('home',{});return}
  if(sheetOn){if(DIR[k]){e.preventDefault();move(DIR[k])}else if(k==='Enter'||k===' '){e.preventDefault();act()}return}
  if(route.name==='player'){e.preventDefault();const shown=view.classList.contains('show');
    if(!shown){if(P.mode==='vod'){if(k==='ArrowLeft'||k==='ArrowRight'){P.pos=Math.max(0,Math.min(P.dur,P.pos+(k==='ArrowRight'?10:-10)));pUI();pShow();return}if(k==='Enter'||k===' '){if(P.pos>=20&&P.pos<60){acts.skip();return}P.playing=!P.playing;pUI();pShow();return}}
      else{if(k==='ArrowUp'){zap(1);return}if(k==='ArrowDown'){zap(-1);return}}
      pShow();if(!cur){const t=$(P.mode==='vod'?'#pPP':'[data-k="p:guide"]');if(t)setFocus(t)}return}
    pShow();
    if(k==='l'||k==='L'){acts.plast();return}
    if(P.mode==='live'&&(k==='ArrowUp'||k==='ArrowDown')&&cur&&cur.dataset.k!=='p:guide'&&false){}
    if(P.mode==='live'&&k==='ArrowUp'&&cur&&cur.dataset.k==='p:guide'){zap(1);return}
    if(P.mode==='live'&&k==='ArrowDown'&&cur&&cur.dataset.k==='p:guide'){zap(-1);return}
    if(P.mode==='vod'&&cur&&cur.id==='pScrub'&&(k==='ArrowLeft'||k==='ArrowRight')){P.pos=Math.max(0,Math.min(P.dur,P.pos+(k==='ArrowRight'?10:-10)));pUI();return}
    if(DIR[k]){if(P.mode==='vod'&&k==='ArrowDown'&&cur&&cur.id==='pPP'){setFocus($('#pScrub'));return}if(P.mode==='vod'&&k==='ArrowUp'&&cur&&cur.id==='pScrub'){setFocus($('#pPP'));return}move(DIR[k]);return}
    if(k==='Enter'||k===' ')act();return}
  if(route.name==='live'){
    if(k==='PageDown'){e.preventDefault();G.w=Math.min(4200,G.w+120);if(G.t<G.w)G.t=G.w+5;drawGuide();return}
    if(k==='PageUp'){e.preventDefault();G.w=Math.max(-1440,G.w-120);if(G.t>=G.w+120)G.t=G.w+115;drawGuide();return}
    if(k==='f'||k==='F'){acts.gfav();return}
    if(G.zone==='grid'){if(DIR[k]){e.preventDefault();guideKey(DIR[k])}else if(k==='Enter'||k===' '){e.preventDefault();guideAct()}return}
    if(DIR[k]){e.preventDefault();if(k==='ArrowDown'&&cur&&(cur.closest('#gPanel')||['gWatch','gStart','gFav'].includes(cur.id)||/^g:(prev|next|now)$/.test(cur.dataset.k))){G.zone='grid';if(cur){cur.classList.remove('foc');cur=null}drawGuide();return}move(DIR[k]);return}}
  if(DIR[k]){e.preventDefault();move(DIR[k]);return}
  if(k==='Enter'||k===' '){e.preventDefault();act()}});
/* ---------- fit ---------- */
function fit(){const w=innerWidth,h=innerHeight-76;document.documentElement.style.setProperty('--s',Math.min(w/1920,h/1080))}
addEventListener('resize',fit);fit();
if(matchMedia('(prefers-reduced-motion: reduce)').matches){S.rm=true;document.body.classList.add('rm')}
$('#retryBtn').addEventListener('click',()=>acts.retry());
sync();goRoot('profiles',{});
window.__marquee={S,route:()=>route,cur:()=>cur,goRoot,nav};
})();
